name: Publish layout viewer

on:
  push:
    branches: [main, master]
    paths:
      - site/**
      - .github/workflows/pages.yml
      - results/layout/klayout_gds/adc_top.klayout.gds
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp site/index.html site/adc_top.png site/layout_metadata.json _site/
          cp results/layout/klayout_gds/adc_top.klayout.gds _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
